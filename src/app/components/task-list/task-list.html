
<section class="tasks-card">

  <p class="label">
    TASKFLOW — EXERCICES PAGES 11 À 15
  </p>

  <h2>Liste des tâches</h2>

  <!-- PAGE 14 : COMPUTED -->
  <p>
    <strong>{{ count() }} tâche(s)</strong>
  </p>

  <p>
    Tâches à faire : {{ availableCount() }}
  </p>

  <!-- PAGE 14 : AJOUTER UNE TÂCHE -->
  <div class="buttons">

    <input
      #taskInput
      type="text"
      placeholder="Nouvelle tâche..."
      [value]="newTitle()"
      (input)="newTitle.set(taskInput.value)"
    />

    <button
      type="button"
      (click)="addTask()">
      Ajouter une tâche
    </button>

  </div>

  <!-- PAGE 11 : ETAT VIDE -->
  @if (tasks().length === 0) {

    <p class="array-debug">
      tasks = []
    </p>

    <p class="empty">
      Aucune tâche pour l'instant
    </p>

  } @else {

    <!-- PAGE 15 : COMMUNICATION PARENT / ENFANT -->
    <ul class="tasks">

      @for (task of tasks(); track task.id) {

        <li>
          <app-task-card
            [task]="task"
            (completed)="onCompleted($event)"
            (removed)="removeTask($event)"
          />
        </li>

      }

    </ul>

  }

  <!-- PAGE 14 : SET -->
  <div class="buttons">

    <button
      type="button"
      (click)="clearTasks()"
      [disabled]="tasks().length === 0">
      Vider la liste
    </button>

    <button
      type="button"
      (click)="restoreTasks()">
      Restaurer les 3 tâches
    </button>

  </div>

</section>
